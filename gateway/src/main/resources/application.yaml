server:
  port: 8083

spring:
  application:
    name: gateway

  cloud:
    gateway:
      server:
        webmvc:
          routes:

            - id: product
              uri: lb://PRODUK
              predicates:
                - Path=/api/produk/**

            - id: pelanggan
              uri: lb://PELANGGAN
              predicates:
                - Path=/api/pelanggan/**

            - id: order
              uri: lb://ORDER
              predicates:
                - Path=/api/order/**

            - id: auth
              uri: lb://AUTH
              predicates:
                - Path=/api/auth/**

            - id: notification-service
              uri: lb://NOTIFICATION
              predicates:
                - Path=/api/notification/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8762/eureka/

    register-with-eureka: true
    fetch-registry: true

  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: "*"

  endpoint:
    health:
      show-details: always

    prometheus:
      enabled: true

  prometheus:
    metrics:
      export:
        enabled: true