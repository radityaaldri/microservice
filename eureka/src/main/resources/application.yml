spring:
  application:
    name: server-eureka

server:
  port: 8762

eureka:
  client:
    register-with-eureka: false
    fetch-registry: false

logging:
  level:
    com.netflix.eureka: OFF
    com.netflix.discovery: OFF

management:
  endpoints:
    web:
      exposure:
        include: "*"

  endpoint:
    health:
      show-details: always
    prometheus:
      enabled: true

  prometheus:
    metrics:
      export:
        enabled: true