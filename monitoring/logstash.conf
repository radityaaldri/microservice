input {
  tcp {
    port => 5000
    codec => json
  }
}

filter {
  if ![service] {
    mutate {
      add_field => {
        "service" => "unknown"
      }
    }
  }

  date {
    match => [ "timestamp", "ISO8601" ]
    target => "@timestamp"
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "microservice-logs-%{+YYYY.MM.dd}"
  }

  stdout {
    codec => rubydebug
  }
}