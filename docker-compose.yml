version: "3.9"

services:

  ####################################################
  ## PROMETHEUS
  ####################################################
  prometheus:
    image: prom/prometheus:latest
    container_name: latech-prometheus
    restart: unless-stopped

    ports:
      - "9090:9090"

    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml

    command:
      - "--config.file=/etc/prometheus/prometheus.yml"

    networks:
      - monitoring

  ####################################################
  ## GRAFANA
  ####################################################
  grafana:
    image: grafana/grafana:latest
    container_name: latech-grafana
    restart: unless-stopped

    ports:
      - "3000:3000"

    depends_on:
      - prometheus

    volumes:
      - grafana-storage:/var/lib/grafana

    networks:
      - monitoring

  ####################################################
  ## ELASTICSEARCH
  ####################################################
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.9
    container_name: latech-elasticsearch
    restart: unless-stopped

    environment:
      discovery.type: single-node
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"

    ports:
      - "9200:9200"

    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data

    networks:
      - monitoring

  ####################################################
  ## LOGSTASH
  ####################################################
  logstash:
    image: docker.elastic.co/logstash/logstash:7.17.9
    container_name: latech-logstash
    restart: unless-stopped

    depends_on:
      - elasticsearch

    ports:
      - "5000:5000"
      - "5044:5044"
      - "9600:9600"

    volumes:
      - ./monitoring/logstash.conf:/usr/share/logstash/pipeline/logstash.conf

    networks:
      - monitoring

  ####################################################
  ## KIBANA
  ####################################################
  kibana:
    image: docker.elastic.co/kibana/kibana:7.17.9
    container_name: latech-kibana
    restart: unless-stopped

    depends_on:
      - elasticsearch

    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200

    ports:
      - "5601:5601"

    networks:
      - monitoring

####################################################
## NETWORK
####################################################

networks:
  monitoring:
    driver: bridge

####################################################
## VOLUMES
####################################################

volumes:
  grafana-storage:
  elasticsearch-data: